name: Release Snapshot

on:
  pull_request:
    types: [closed]
    branches: [release_candidate]

jobs:
  deploy-snapshot-to-clojars:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: clojars
          server-username: CLOJARS_USERNAME
          server-password: CLOJARS_PASSWORD

      - name: Read project version from pom.xml
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Build snapshot version
        id: build_version
        run: echo "version=${{ steps.version.outputs.version }}-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Deploy artifact to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: mvn deploy -Drevision=${{ steps.build_version.outputs.version }} -DskipTests
